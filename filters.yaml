# -------------------------------------------------------------------
# Upwork Job Scraper — Filter Configuration
# -------------------------------------------------------------------
# API-SIDE FILTERS (sent directly in the GraphQL query)
# -------------------------------------------------------------------

# Free-text keyword search (Lucene partial syntax supported)
# Examples: "python web scraping", "react OR vue", "machine learning"
keywords: "n8n OR \"make.com\" OR zapier OR \"AI agent\" OR \"AI agents\" OR \"AI automation\" OR \"workflow automation\" OR GoHighLevel OR \"LLM\" OR \"Claude\" OR \"OpenAI\""

# Skills — canonical slug names, OR logic (job matches if ANY skill present)
# Use lookup_skills.py to discover the correct slugs
# Examples: python, react, javascript, web-scraping, flask, node-js
skills:
  # - python
  # - react
  # - web-scraping

# Experience level: ENTRY_LEVEL, INTERMEDIATE, EXPERT  (leave blank for all)
experience_level: ""

# Contract type: HOURLY, FIXED_PRICE  (leave blank for all)
job_type: ""

# Budget range for fixed-price jobs (dollars)
budget_min: 800
budget_max: null

# Hourly rate range (dollars/hour)
hourly_rate_min: 40
hourly_rate_max: null

# Only show jobs from clients with verified payment method
verified_payment_only: true

# Filter by client country/city (OR logic — matches if client is in ANY listed location)
# Use full country names or city names as they appear on Upwork
# Examples: "United States", "United Kingdom", "Canada", "Australia", "Germany"
locations:
  - United States
  - United Kingdom
  - Canada
  - Australia
  - United Arab Emirates

# Only show jobs posted within the last N days (1-30)
days_posted: 3

# -------------------------------------------------------------------
# POST-FILTERS (applied in Python after fetching results)
# -------------------------------------------------------------------

# Minimum hire rate: client.totalHires / client.totalPostedJobs
# 0.0 = no filter, 0.5 = at least 50% of posted jobs led to a hire
min_hire_rate: 0.4

# Minimum total amount the client has spent on Upwork (dollars)
min_total_spend: 1000

# Minimum number of reviews the client has received
min_reviews: 1

# Minimum average feedback/rating (0.0 – 5.0)
min_rating: 4.2

# -------------------------------------------------------------------
# FIT SCORING (scoring.py) — 0-100 score vs. your profile
# -------------------------------------------------------------------
# Jobs scoring below min_score are dropped before notifying. 0 = off.
scoring:
  min_score: 50
  min_fixed_budget: 800
  min_hourly: 40
  max_applicants: 20
  # Budget -> weeks we can deliver in. We only bid when the job's scope fits
  # the tier for its budget (higher budget = more time). Sorted ascending.
  budget_tiers:
    - {up_to: 1500, weeks: 1}      # ~$1,200 per week of scope
    - {up_to: 2000, weeks: 2}
    - {up_to: 3000, weeks: 3}      # 2.5-3 weeks
  # Fixed budgets above the last tier are never auto-bid: they need a custom
  # scope from you and your approval first.
  manual_review_above: 3000   # $3,001+ = custom timeline, needs your scope/approval
  # Brand-new clients (no spend, no reviews) skip the client-history filters
  # when the job is well budgeted OR the post shows buyer credibility
  # (long description that names a website/company link).
  new_client_bet:
    enabled: true
    min_fixed_budget: 1000
    min_hourly: 40
    min_description_chars: 800
  daily_apply_cap: 10

# -------------------------------------------------------------------
# AUTO-APPLY (apply.py / pipeline.py)
# -------------------------------------------------------------------
apply:
  daily_cap: 10               # max proposals in any rolling 24 hours
  max_per_cycle: 10           # max new jobs drafted per 30-min poll (limits API spend and Slack flood)
  auto_below_budget: 3000     # fixed jobs under this apply automatically
                              # (3,000 and above wait for your Slack approval)
  hourly_bid: 40              # $/hr we bid on hourly jobs
  milestone_split: [50, 50]   # fixed jobs: % per milestone

# -------------------------------------------------------------------
# PAGINATION
# -------------------------------------------------------------------
# Max results per page (max 50)
page_size: 50
