# -------------------------------------------------------------------
# Upwork Job Scraper — Filter Configuration
# -------------------------------------------------------------------
# API-SIDE FILTERS (sent directly in the GraphQL query)
# -------------------------------------------------------------------

# Free-text keyword search (Lucene partial syntax supported)
# Examples: "python web scraping", "react OR vue", "machine learning"
keywords: "zapier OR make.com OR Zapier OR n8n or Airtable"

# Skills — canonical slug names, OR logic (job matches if ANY skill present)
# Use lookup_skills.py to discover the correct slugs
# Examples: python, react, javascript, web-scraping, flask, node-js
skills:
  # - python
  # - react
  # - web-scraping

# Experience level: ENTRY_LEVEL, INTERMEDIATE, EXPERT  (leave blank for all)
experience_level: ""

# Contract type: HOURLY, FIXED_PRICE  (leave blank for all)
job_type: ""

# Budget range for fixed-price jobs (dollars)
budget_min: 1000
budget_max: null

# Hourly rate range (dollars/hour)
hourly_rate_min: 35
hourly_rate_max: null

# Only show jobs from clients with verified payment method
verified_payment_only: true

# Filter by client country/city (OR logic — matches if client is in ANY listed location)
# Use full country names or city names as they appear on Upwork
# Examples: "United States", "United Kingdom", "Canada", "Australia", "Germany"
locations:
  - United States
  - United Kingdom
  - Canada
  - Australia

# Only show jobs posted within the last N days (1-30)
days_posted: 3

# -------------------------------------------------------------------
# POST-FILTERS (applied in Python after fetching results)
# -------------------------------------------------------------------

# Minimum hire rate: client.totalHires / client.totalPostedJobs
# 0.0 = no filter, 0.5 = at least 50% of posted jobs led to a hire
min_hire_rate: 0.7

# Minimum total amount the client has spent on Upwork (dollars)
min_total_spend: 10000

# Minimum number of reviews the client has received
min_reviews: 5

# Minimum average feedback/rating (0.0 – 5.0)
min_rating: 4.2

# -------------------------------------------------------------------
# PAGINATION
# -------------------------------------------------------------------
# Max results per page (max 50)
page_size: 50
